[project]
name = "crm-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S110", "S112"]

[tool.mypy]
strict = true
files = ["harness", "tests", "tools"]

[[tool.mypy.overrides]]
module = "psycopg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
